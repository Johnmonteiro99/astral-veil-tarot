<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Return to the Archive | Astral Veil Admin</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preload" as="image" href="assets/images/concepts-ideas/astral-veil-admin-login-background.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Orbitron:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050712;
        --panel: rgba(20, 17, 43, 0.34);
        --field: rgba(31, 28, 67, 0.52);
        --text: #f5edf8;
        --muted: #c6b6ec;
        --crimson: #a91f2f;
        --crimson-bright: #ff5a66;
        --violet: #b46cff;
        --violet-soft: rgba(180, 108, 255, 0.44);
        --violet-line: rgba(196, 129, 255, 0.58);
        --magenta: #ff3f9b;
        --gold: #f1c763;
        --gold-bright: #ffe08a;
        --danger: #ffb3c7;
      }

      * {
        box-sizing: border-box;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          linear-gradient(180deg, rgba(3, 5, 15, 0.16), rgba(3, 4, 11, 0.72)),
          radial-gradient(circle at 31% 18%, rgba(255, 42, 95, 0.16), transparent 20rem),
          radial-gradient(circle at 73% 48%, rgba(104, 46, 255, 0.18), transparent 28rem),
          url("assets/images/concepts-ideas/astral-veil-admin-login-background.png") center / cover no-repeat fixed,
          var(--bg);
        color: var(--text);
        font-family: Rajdhani, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        isolation: isolate;
        padding: clamp(1rem, 3vw, 1.65rem);
      }

      body::before,
      body::after {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        z-index: 0;
      }

      body::before {
        border: 1px solid rgba(195, 122, 255, 0.58);
        clip-path: polygon(
          0 0,
          7rem 0,
          7rem 1px,
          1px 1px,
          1px 7rem,
          0 7rem,
          0 0,
          calc(100% - 7rem) 0,
          100% 0,
          100% 7rem,
          calc(100% - 1px) 7rem,
          calc(100% - 1px) 1px,
          calc(100% - 7rem) 1px,
          calc(100% - 7rem) 0,
          100% calc(100% - 7rem),
          100% 100%,
          calc(100% - 7rem) 100%,
          calc(100% - 7rem) calc(100% - 1px),
          calc(100% - 1px) calc(100% - 1px),
          calc(100% - 1px) calc(100% - 7rem),
          100% calc(100% - 7rem),
          0 calc(100% - 7rem),
          1px calc(100% - 7rem),
          1px calc(100% - 1px),
          7rem calc(100% - 1px),
          7rem 100%,
          0 100%
        );
        margin: clamp(1rem, 3vw, 1.65rem);
        opacity: 0.85;
      }

      body::after {
        background:
          linear-gradient(90deg, rgba(255, 60, 150, 0.18), transparent 12%, transparent 88%, rgba(183, 98, 255, 0.15)),
          linear-gradient(180deg, rgba(4, 5, 15, 0.18), rgba(4, 5, 15, 0.4));
        mix-blend-mode: screen;
        opacity: 0.6;
      }

      .admin-hud {
        position: fixed;
        inset: clamp(1.6rem, 4vw, 3.35rem);
        pointer-events: none;
        z-index: 1;
      }

      .admin-hud::before,
      .admin-hud::after {
        position: absolute;
        color: var(--gold-bright);
        font-family: Orbitron, Rajdhani, system-ui, sans-serif;
        font-size: clamp(0.64rem, 1.1vw, 0.78rem);
        font-weight: 700;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(241, 199, 99, 0.38);
      }

      .admin-hud::before {
        top: 1rem;
        right: 0;
        content: "Secure Admin Protocol // Archive Node 07";
      }

      .admin-hud::after {
        left: 0;
        bottom: 45%;
        color: var(--magenta);
        content: "Astral Veil";
      }

      .hud-star {
        position: absolute;
        top: 1.5rem;
        left: 1.6rem;
        width: 3.25rem;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 64, 144, 0.45);
        transform: rotate(45deg);
        box-shadow: 0 0 24px rgba(255, 64, 144, 0.22);
      }

      .hud-star::before,
      .hud-star::after {
        position: absolute;
        inset: 50% auto auto 50%;
        width: 150%;
        height: 1px;
        background: rgba(255, 64, 144, 0.58);
        content: "";
        transform: translate(-50%, -50%) rotate(-45deg);
      }

      .hud-star::after {
        transform: translate(-50%, -50%) rotate(45deg);
      }

      main {
        position: relative;
        z-index: 2;
        width: min(100%, 44.5rem);
        min-height: min(72vh, 43rem);
        display: grid;
        align-content: center;
        padding: clamp(2rem, 4vw, 3.45rem) clamp(1.45rem, 5vw, 4.25rem);
        border: 1px solid var(--violet-line);
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(25, 22, 55, 0.42), rgba(10, 10, 30, 0.26)),
          radial-gradient(circle at 50% 0%, rgba(167, 92, 255, 0.1), transparent 22rem);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.03) inset,
          0 0 24px rgba(184, 91, 255, 0.42),
          0 0 82px rgba(111, 59, 255, 0.25),
          0 36px 110px rgba(0, 0, 0, 0.62);
        backdrop-filter: blur(12px) saturate(128%);
      }

      main::after {
        position: absolute;
        left: 50%;
        width: min(16rem, 44%);
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--violet), transparent);
        content: "";
        transform: translateX(-50%);
      }

      main::after {
        bottom: 2.75rem;
        width: min(15rem, 48%);
      }

      h1 {
        display: grid;
        gap: 0;
        justify-items: center;
        margin: 0;
        color: transparent;
        background: linear-gradient(180deg, #ff6970 0%, #c83242 42%, #6e111c 100%);
        -webkit-background-clip: text;
        background-clip: text;
        font-family: Cinzel, Georgia, "Times New Roman", serif;
        font-size: clamp(4.15rem, 8vw, 7.2rem);
        font-weight: 600;
        line-height: 0.74;
        letter-spacing: 0.02em;
        text-align: center;
        -webkit-text-stroke: 0.25px rgba(255, 158, 164, 0.34);
        text-shadow:
          0 0 3px rgba(255, 78, 91, 0.28),
          0 0 10px rgba(190, 28, 49, 0.2),
          0 2px 0 rgba(50, 5, 15, 0.78);
        text-transform: uppercase;
      }

      h1 span:nth-child(2) {
        margin: 0.55rem 0 0.42rem;
        font-size: 0.26em;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.28em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .admin-subtitle {
        margin-top: 1.45rem;
        color: #d8c7ff;
        font-family: Orbitron, Rajdhani, system-ui, sans-serif;
        font-size: clamp(0.92rem, 2vw, 1.05rem);
        font-weight: 700;
        letter-spacing: 0.36em;
        text-align: center;
        text-transform: uppercase;
        text-shadow: 0 0 14px rgba(182, 111, 255, 0.35);
      }

      form {
        display: grid;
        gap: 1.15rem;
        width: min(100%, 36rem);
        margin: clamp(1.55rem, 4vw, 2.3rem) auto 0;
      }

      label {
        position: relative;
        display: block;
        color: var(--muted);
        font-family: Orbitron, Rajdhani, system-ui, sans-serif;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }

      label::after {
        position: absolute;
        top: 50%;
        z-index: 1;
        color: var(--magenta);
        font-size: 1.1rem;
        font-family: Orbitron, Rajdhani, system-ui, sans-serif;
        transform: translateY(-50%);
      }

      label::after {
        right: 1.05rem;
        color: var(--violet);
        content: "==";
      }

      .field-icon {
        position: absolute;
        top: 50%;
        left: 1.05rem;
        z-index: 1;
        width: 1.28rem;
        height: 1.28rem;
        color: var(--magenta);
        filter: drop-shadow(0 0 8px rgba(255, 63, 155, 0.46));
        transform: translateY(-50%);
      }

      .field-icon svg {
        display: block;
        width: 100%;
        height: 100%;
        stroke: currentColor;
        stroke-width: 1.8;
      }

      input {
        width: 100%;
        min-height: 3.75rem;
        border: 1px solid rgba(177, 112, 255, 0.52);
        border-radius: 6px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.065), rgba(255, 255, 255, 0.025)),
          var(--field);
        color: var(--text);
        font: 700 1rem/1 Rajdhani, system-ui, sans-serif;
        letter-spacing: 0.23em;
        padding: 1rem 3.3rem 1rem 4.35rem;
        outline: none;
        text-transform: none;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.035) inset,
          0 0 24px rgba(121, 77, 255, 0.13) inset;
        transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease, transform 160ms ease;
      }

      input::placeholder {
        color: rgba(212, 196, 246, 0.58);
        text-transform: uppercase;
      }

      input:focus {
        border-color: var(--violet);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.095), rgba(255, 255, 255, 0.035)),
          rgba(43, 32, 82, 0.62);
        box-shadow:
          0 0 0 3px rgba(178, 103, 255, 0.12),
          0 0 32px rgba(178, 103, 255, 0.22),
          0 0 24px rgba(121, 77, 255, 0.16) inset;
      }

      button,
      a {
        border-radius: 6px;
        font-family: Orbitron, Rajdhani, system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      button {
        justify-self: center;
        width: min(100%, 22rem);
        min-height: 3.45rem;
        margin-top: 0.95rem;
        border: 1px solid rgba(255, 224, 138, 0.72);
        background:
          linear-gradient(180deg, rgba(255, 224, 138, 0.14), rgba(241, 199, 99, 0.06)),
          rgba(20, 14, 24, 0.2);
        color: var(--gold-bright);
        cursor: pointer;
        box-shadow:
          0 0 18px rgba(241, 199, 99, 0.18),
          0 15px 34px rgba(241, 199, 99, 0.08),
          0 0 20px rgba(255, 224, 138, 0.08) inset;
        transition: box-shadow 160ms ease, transform 160ms ease, filter 160ms ease;
      }

      button::after {
        content: " →";
      }

      button:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
        box-shadow:
          0 0 24px rgba(241, 199, 99, 0.3),
          0 18px 40px rgba(241, 199, 99, 0.12),
          0 0 28px rgba(255, 224, 138, 0.12) inset;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.72;
        transform: none;
      }

      a {
        justify-content: center;
        align-items: center;
        width: fit-content;
        min-height: 2.35rem;
        margin: 2.35rem auto 0;
        color: #d9c4ff;
        font-size: clamp(0.76rem, 2vw, 0.92rem);
        text-decoration: none;
        text-shadow: 0 0 14px rgba(180, 108, 255, 0.36);
      }

      a::before,
      a::after {
        width: clamp(3rem, 9vw, 7rem);
        height: 1px;
        margin: 0 0.75rem;
        background: linear-gradient(90deg, transparent, var(--violet));
        content: "";
      }

      a::after {
        background: linear-gradient(90deg, var(--violet), transparent);
      }

      a:focus-visible,
      button:focus-visible {
        outline: 3px solid rgba(180, 108, 255, 0.35);
        outline-offset: 3px;
      }

      [data-auth-message] {
        min-height: 1.45rem;
        margin-top: 0.1rem;
        color: var(--muted);
        font-size: 0.96rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-align: center;
      }

      [data-auth-message].is-error {
        padding: 0.8rem 0.9rem;
        border: 1px solid rgba(255, 82, 143, 0.35);
        border-radius: 7px;
        background: rgba(95, 15, 46, 0.32);
        color: var(--danger);
        box-shadow: 0 0 28px rgba(255, 51, 117, 0.14);
      }

      @media (max-width: 800px) {
        body {
          align-items: center;
          padding: 1rem;
          background-attachment: scroll;
        }

        main {
          width: 100%;
          min-height: auto;
          border-radius: 22px;
        }

        .admin-hud::before,
        .admin-hud::after,
        .hud-star {
          display: none;
        }
      }

      @media (max-width: 520px) {
        h1 {
          font-size: clamp(3.15rem, 18vw, 4.7rem);
        }

        .admin-subtitle {
          letter-spacing: 0.22em;
        }

        input {
          min-height: 3.35rem;
          letter-spacing: 0.14em;
          padding-left: 3.4rem;
        }

        .field-icon {
          left: 0.85rem;
        }

        a::before,
        a::after {
          width: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="admin-hud" aria-hidden="true">
      <span class="hud-star"></span>
    </div>
    <main>
      <h1>
        <span>RETURN</span>
        <span>TO THE</span>
        <span>ARCHIVE</span>
      </h1>
      <p class="admin-subtitle">ADMINISTRATIVE ACCESS ONLY</p>

      <form data-admin-login-form>
        <label>
          <span class="sr-only">Identity Name</span>
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" focusable="false">
              <circle cx="12" cy="7.5" r="3.4" />
              <path d="M5.6 20c.7-4 3-6.1 6.4-6.1s5.7 2.1 6.4 6.1" />
            </svg>
          </span>
          <input type="email" name="email" autocomplete="email" placeholder="Identity Name" required />
        </label>
        <label>
          <span class="sr-only">Encryption Key</span>
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" focusable="false">
              <rect x="5.4" y="10.2" width="13.2" height="9.2" rx="1.6" />
              <path d="M8.3 10.2V7.4a3.7 3.7 0 0 1 7.4 0v2.8" />
              <path d="M12 14.1v2.2" />
            </svg>
          </span>
          <input type="password" name="password" autocomplete="current-password" placeholder="Encryption Key" required />
        </label>
        <button type="submit">ENTER ADMIN ARCHIVE</button>
        <p data-auth-message role="status" aria-live="polite"></p>
      </form>

      <a href="index.html">Return to Astral Veil</a>
    </main>

    <script type="module">
      import {
        signIn,
        isCurrentUserAdmin,
        setAdminVerified,
        clearAdminVerified,
        hasAdminVerified,
      } from './src/services/auth.js';
      import { isSupabaseConfigured } from './src/services/supabase-client.js';

      const form = document.querySelector('[data-admin-login-form]');
      const message = document.querySelector('[data-auth-message]');
      const button = form.querySelector('button');

      function setMessage(text, isError = false) {
        message.textContent = text;
        message.classList.toggle('is-error', isError);
      }

      if (!isSupabaseConfigured()) {
        setMessage('The archive connection is not configured for this environment.', true);
        button.disabled = true;
      }

      async function redirectIfAdminGateIsValid() {
        try {
          if (!isSupabaseConfigured() || !hasAdminVerified()) {
            clearAdminVerified();
            return;
          }

          const { isAdmin, error } = await isCurrentUserAdmin();

          if (!error && isAdmin) {
            window.location.replace('admin.html');
            return;
          }

          clearAdminVerified();
        } catch (error) {
          console.warn('Admin gate recheck failed:', {
            message: error?.message || '',
            code: error?.code || '',
          });
          clearAdminVerified();
        }
      }

      redirectIfAdminGateIsValid();

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(form);
        const email = String(formData.get('email') || '').trim();
        const password = String(formData.get('password') || '');

        button.disabled = true;
        setMessage('Checking archive access...');

        try {
          const { error } = await signIn(email, password);

          if (error) {
            clearAdminVerified();
            button.disabled = false;
            setMessage('We could not open the archive with those credentials. Please check your email and password.', true);
            return;
          }

          const { isAdmin, error: profileError } = await isCurrentUserAdmin();

          if (profileError) {
            clearAdminVerified();
            button.disabled = false;
            setMessage('Your account was found, but the admin profile could not be verified.', true);
            return;
          }

          if (!isAdmin) {
            clearAdminVerified();
            button.disabled = false;
            setMessage('This account does not have admin access.', true);
            return;
          }

          setAdminVerified();
          window.location.assign('admin.html');
        } catch (error) {
          console.error('Admin login failed:', {
            message: error?.message || '',
            code: error?.code || '',
          });
          clearAdminVerified();
          button.disabled = false;
          setMessage('Admin access could not be verified. Please try again.', true);
        }
      });
    </script>
  </body>
</html>
