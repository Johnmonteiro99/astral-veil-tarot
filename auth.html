<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in or sign up for an Astral Veil account." />
    <title>Log In | Astral Veil</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08070d;
        --panel: rgba(18, 15, 27, 0.86);
        --panel-strong: rgba(30, 24, 42, 0.94);
        --text: #f8f0e7;
        --muted: #cfc0b5;
        --line: rgba(218, 174, 112, 0.28);
        --ember: #c65a37;
        --gold: #e7bd77;
        --error: #ffb6b6;
        --success: #d6f1c2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          linear-gradient(180deg, rgba(8, 7, 13, 0.68), rgba(8, 7, 13, 0.96)),
          url("assets/images/hall-of-mirrors.webp") center / cover no-repeat fixed,
          var(--bg);
        color: var(--text);
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: clamp(1rem, 4vw, 2rem);
      }

      main {
        width: min(100%, 31rem);
        display: grid;
        gap: 1.25rem;
        padding: clamp(1.35rem, 5vw, 2.2rem);
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.015)),
          var(--panel);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.46);
        backdrop-filter: blur(14px);
      }

      .auth-heading {
        display: grid;
        gap: 0.45rem;
      }

      .eyebrow,
      label,
      button,
      .text-link {
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow {
        margin: 0;
        color: var(--gold);
        font-size: 0.78rem;
      }

      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(2.45rem, 12vw, 4rem);
        line-height: 0.95;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }

      .mode-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        padding: 0.35rem;
        border: 1px solid rgba(231, 189, 119, 0.18);
        border-radius: 8px;
        background: rgba(4, 3, 8, 0.48);
      }

      button,
      .text-link {
        min-height: 2.85rem;
        border-radius: 6px;
        font-family: inherit;
      }

      button {
        border: 1px solid rgba(231, 189, 119, 0.34);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        cursor: pointer;
      }

      button:hover,
      button:focus-visible,
      button.is-active {
        border-color: rgba(231, 189, 119, 0.7);
        background: rgba(198, 90, 55, 0.2);
        color: var(--gold);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.68;
      }

      form {
        display: grid;
        gap: 0.95rem;
      }

      label {
        display: grid;
        gap: 0.45rem;
        color: var(--gold);
        font-size: 0.76rem;
      }

      input {
        width: 100%;
        min-height: 3.05rem;
        border: 1px solid rgba(231, 189, 119, 0.28);
        border-radius: 6px;
        background: var(--panel-strong);
        color: var(--text);
        font: 500 1rem/1.4 inherit;
        padding: 0.85rem 0.95rem;
      }

      input:focus {
        border-color: rgba(231, 189, 119, 0.78);
        outline: 3px solid rgba(198, 90, 55, 0.22);
      }

      .primary-action {
        margin-top: 0.35rem;
        background:
          linear-gradient(180deg, rgba(231, 189, 119, 0.22), rgba(198, 90, 55, 0.18)),
          rgba(23, 15, 18, 0.88);
        color: var(--gold);
      }

      [data-auth-message] {
        padding: 0.85rem;
        border: 1px solid rgba(231, 189, 119, 0.22);
        border-radius: 6px;
        background: rgba(8, 6, 12, 0.68);
        color: var(--muted);
      }

      [data-auth-message][hidden],
      [hidden] {
        display: none;
      }

      [data-message-type="error"] {
        border-color: rgba(255, 104, 104, 0.42);
        color: var(--error);
      }

      [data-message-type="success"] {
        border-color: rgba(168, 226, 130, 0.42);
        color: var(--success);
      }

      .auth-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: space-between;
      }

      .text-link {
        display: inline-flex;
        align-items: center;
        color: var(--gold);
        font-size: 0.78rem;
        text-decoration: none;
      }

      @media (max-width: 520px) {
        main {
          width: 100%;
        }

        .auth-links {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="auth-heading" aria-labelledby="auth-title">
        <p class="eyebrow">Astral Veil Account</p>
        <h1 id="auth-title" data-auth-title>Log In</h1>
        <p data-auth-copy>Return to your archive and keep your thread close.</p>
      </section>

      <div class="mode-switch" aria-label="Choose authentication mode">
        <button class="is-active" type="button" data-auth-mode="login" aria-pressed="true">Log In</button>
        <button type="button" data-auth-mode="signup" aria-pressed="false">Sign Up</button>
      </div>

      <form data-user-auth-form>
        <label data-display-name-field hidden>
          Display Name
          <input name="display_name" type="text" autocomplete="name" disabled />
        </label>
        <label>
          Email
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="primary-action" type="submit" data-auth-submit>Log In</button>
      </form>

      <p data-auth-message role="status" aria-live="polite" hidden></p>

      <div class="auth-links">
        <a class="text-link" href="index.html">Back to Astral Veil</a>
        <a class="text-link" href="account.html" data-account-link hidden>Go to Account</a>
      </div>
    </main>

    <script type="module" src="src/public/user-auth.js"></script>
  </body>
</html>
